# Nginx-конфиг для контейнера frontend (лаба 8):
# 1) reverse-proxy API и WebSocket на backend;
# 2) SPA-fallback для react-router.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # REST API → backend (имя сервиса из docker-compose, внутренняя сеть frontend)
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO (лаба 7) → backend: проброс WebSocket через Upgrade/Connection,
    # длинный таймаут — живые голоса/typing-уведомления не должны обрываться
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Статика с кэшем; прочие пути → index.html (SPA History API)
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
