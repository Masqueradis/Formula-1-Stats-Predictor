services:
  postgres:
    image: postgres:16-alpine
    container_name: f1stats-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-f1user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-f1pass}
      POSTGRES_DB: ${POSTGRES_DB:-f1stats}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-f1user} -d ${POSTGRES_DB:-f1stats}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
