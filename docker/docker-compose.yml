
services:
  postgres:
    image: postgres:16-alpine
    container_name: f1stats-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-f1user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-f1pass}
      POSTGRES_DB: ${POSTGRES_DB:-f1stats}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-f1user} -d ${POSTGRES_DB:-f1stats}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  mailhog:
    image: mailhog/mailhog
    container_name: f1stats-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - backend

  mongo:
    image: mongo:7
    container_name: f1stats-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 })' | grep -q ok"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: f1stats-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - backend

  backend:
    build: ../server
    container_name: f1stats-backend
    restart: unless-stopped
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-f1user}:${POSTGRES_PASSWORD:-f1pass}@postgres:5432/${POSTGRES_DB:-f1stats}
      MONGO_URI: mongodb://mongo:27017/f1stats
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      CORS_ORIGINS: http://localhost,http://localhost:5173
      FRONTEND_URL: http://localhost
      JWT_SECRET: ${JWT_SECRET:-dev-f1-secret-change-in-production}
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      NODE_ENV: development
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - frontend
      - backend

  frontend:
    build: ../client
    container_name: f1stats-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend


  backend-dev:
    profiles: [dev]
    build: ../server
    container_name: f1stats-backend-dev
    restart: unless-stopped
    command: npm run dev
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-f1user}:${POSTGRES_PASSWORD:-f1pass}@postgres:5432/${POSTGRES_DB:-f1stats}
      MONGO_URI: mongodb://mongo:27017/f1stats
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      CORS_ORIGINS: http://localhost,http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-dev-f1-secret-change-in-production}
      REDIS_URL: redis://redis:6379
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      NODE_ENV: development
      PORT: "3000"
    volumes:
      - ../server/src:/app/src
      - ../server/migrations:/app/migrations
      - ../server/seeders:/app/seeders
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend
      - backend

  frontend-dev:
    profiles: [dev]
    build:
      context: ../client
      target: builder
    container_name: f1stats-frontend-dev
    restart: unless-stopped
    command: npm run dev
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://backend-dev:3000
    volumes:
      - ../client/src:/app/src
      - ../client/index.html:/app/index.html
      - ../client/vite.config.js:/app/vite.config.js
      - ../client/public:/app/public
    depends_on:
      - backend-dev
    networks:
      - frontend
      - backend

  loki:
    image: grafana/loki:3.2.1
    container_name: f1stats-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml:ro
      - lokidata:/loki
    ports:
      - "3100:3100"
    networks:
      - monitoring

  promtail:
    image: grafana/promtail:3.2.1
    container_name: f1stats-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.2.0
    container_name: f1stats-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - loki
    networks:
      - monitoring

networks:
  frontend:
  backend:
  monitoring:

volumes:
  pgdata:
  mongodata:
  redisdata:
  lokidata:
  grafanadata:
