services:
  postgres:
    image: postgres:16-alpine
    container_name: f1stats-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-f1user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-f1pass}
      POSTGRES_DB: ${POSTGRES_DB:-f1stats}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-f1user} -d ${POSTGRES_DB:-f1stats}"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog
    container_name: f1stats-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  mongo:
    image: mongo:7
    container_name: f1stats-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 })' | grep -q ok"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  mongodata: